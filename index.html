<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방랑일지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            color: #000000;
        }
        
        /* 상단 메뉴바 */
        .navbar {
            background: #000000;
            width: 100%;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        
        .nav-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            list-style: none;
        }
        
        .nav-menu li {
            display: inline;
        }
        
        .nav-menu a {
            color: #808080;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        /* 메인 콘텐츠 */
        .main-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 80px;
        }
        
        .title-image {
            max-width: 500px;
            width: 90%;
            height: auto;
            margin-bottom: 40px;
        }
        
        .horse-image {
            width: 350px;
            height: auto;
            margin-bottom: 40px;
            animation: bounce 2s infinite;
        }
        
        .text-content {
            margin-top: 20px;
            text-align: center;
        }
        
        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="#art">그림</a></li>
            <li>|</li>
            <li><a href="#games">웹 게임</a></li>
            <li>|</li>
            <li><a href="#devlog">여정 기록</a></li>
            <li>|</li>
            <li><a href="#about">소개</a></li>
        </ul>
    </nav>
    
    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <img src="title.png" alt="방랑일지" class="title-image">
        <img src="horse_.png" alt="horse" class="horse-image">
        <div class="text-content">
            <p>사이트 공사중! ✨</p>
            <p><strong>Coming Soon...</strong></p>
        </div>
    </div>
</body>
</html>
