<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방랑일지</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #000000;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .title-image {
            max-width: 500px;
            width: 90%;
            height: auto;
            margin-bottom: 40px;
        }
        
        .horse-image {
            width: 350px;
            height: auto;
            margin-bottom: 40px;
            animation: bounce 2s infinite;
        }
        
        .text-content {
            margin-top: 20px;
        }
        
        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="title.png" alt="방랑일지" class="title-image">
        <img src="horse_.png" alt="horse" class="horse-image">
        <div class="text-content">
            <p>사이트 공사중! ✨</p>
            <p><strong>Coming Soon...</strong></p>
        </div>
    </div>
</body>
</html>
