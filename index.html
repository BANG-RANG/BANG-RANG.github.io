<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방랑일지</title>
    <style>
        /* 폰트 정의 */
        @font-face {
            font-family: 'Hakgyoansim';
            src: url('Hakgyoansim Byeolbichhaneul TTF B.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            color: #000000;
        }
        
        /* 상단 메뉴바 */
        .navbar {
            background: #000000;
            width: 100%;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* 홈 아이콘 */
        .home-icon {
            height: 40px;
            width: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .home-icon:hover {
            transform: scale(1.1);
        }
        
        /* 메뉴 */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 50px;
            list-style: none;
            font-family: 'Hakgyoansim', 'Batang', serif;
            margin: 0 auto;
        }
        
        .nav-menu li {
            display: inline;
        }
        
        .nav-menu a {
            color: #808080;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover {
            color: #ffffff;
        }
        
        /* 메인 콘텐츠 */
        .main-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px 20px;
        }
        
        .title-image {
            width: 80%;
            max-width: 800px;
            height: auto;
            margin-bottom: 40px;
        }
        
        .horse-image {
            width: 60%;
            max-width: 400px;
            height: auto;
            margin-bottom: 40px;
            animation: bounce 2s infinite;
        }
        
        .text-content {
            margin-top: 20px;
            text-align: center;
        }
        
        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        /* 태블릿 (768px 이하) */
        @media (max-width: 768px) {
            .home-icon {
                height: 35px;
            }
            
            .nav-menu {
                gap: 30px;
            }
            
            .nav-menu a {
                font-size: 1em;
            }
            
            .title-image {
                width: 85%;
            }
            
            .horse-image {
                width: 70%;
            }
            
            p {
                font-size: 1.1em;
            }
        }
        
        /* 모바일 (480px 이하) */
        @media (max-width: 480px) {
            .navbar {
                padding: 10px 15px;
                flex-direction: column;
                gap: 10px;
            }
            
            .home-icon {
                height: 30px;
                align-self: flex-start;
            }
            
            .nav-menu {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-menu a {
                font-size: 0.9em;
            }
            
            .title-image {
                width: 90%;
            }
            
            .horse-image {
                width: 80%;
            }
            
            p {
                font-size: 1em;
            }
            
            .main-content {
                padding: 100px 15px 30px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="navbar">
        <a href="index.html">
            <img src="icon/homeicon.png" alt="홈" class="home-icon">
        </a>
        <ul class="nav-menu">
            <li><a href="art.html">그림</a></li>
            <li>|</li>
            <li><a href="game.html">웹 게임</a></li>
            <li>|</li>
            <li><a href="#devlog">여정 기록</a></li>
            <li>|</li>
            <li><a href="#about">소개</a></li>
        </ul>
        <div style="width: 40px;"></div>
    </nav>
    
    <!-- 메인 콘텐츠 -->
    <div class="main-content">
        <img src="title.png" alt="방랑일지" class="title-image">
        <img src="horse_.png" alt="horse" class="horse-image">
        <div class="text-content">
            <p>사이트 공사중! ✨</p>
            <p><strong>Coming Soon...</strong></p>
        </div>
    </div>
</body>
</html>
