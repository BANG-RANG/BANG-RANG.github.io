<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방랑일지</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #000000;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        p {
            font-size: 1.3em;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        .horse-image {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="horse_.png" alt="horse" class="horse-image">
        <h1>방랑일지</h1>
        <p>사이트 공사중! 🚧</p>
        <p>곧 멋진 게임과 작품들을 만나보실 수 있어요.</p>
        <p><strong>Coming Soon...</strong></p>
    </div>
</body>
</html>
