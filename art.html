<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그림 - 방랑일지</title>
    <style>
        /* 폰트 정의 */
        @font-face {
            font-family: 'Hakgyoansim';
            src: url('Hakgyoansim Byeolbichhaneul TTF B.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            color: #000000;
        }
        
        /* 상단 메뉴바 */
        .navbar {
            background: #000000;
            width: 100%;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* 홈 아이콘 */
        .home-icon {
            height: 40px;
            width: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .home-icon:hover {
            transform: scale(1.1);
        }
        
        /* 메뉴 */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 50px;
            list-style: none;
            font-family: 'Hakgyoansim', 'Batang', serif;
            margin: 0 auto;
        }
        
        .nav-menu li {
            display: inline;
        }
        
        .nav-menu a {
            color: #808080;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
        }
        
        /* 갤러리 컨테이너 */
        .gallery-container {
            padding: 80px 20px 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 그리드 스타일 갤러리 (순서대로 배치) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .gallery-item video,
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 라이트박스 (이미지 클릭 시 크게 보기) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
        
        /* 반응형 - 모바일 */
        @media (max-width: 768px) {
            .home-icon {
                height: 35px;
            }
            
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-menu {
                gap: 30px;
            }
            
            .nav-menu a {
                font-size: 1em;
            }
        }
        
        @media (max-width: 480px) {
            .navbar {
                padding: 10px 15px;
                flex-direction: column;
                gap: 10px;
            }
            
            .home-icon {
                height: 30px;
                align-self: flex-start;
            }
            
            .nav-menu {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-menu a {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="navbar">
        <a href="index.html">
            <img src="icon/homeicon.png" alt="홈" class="home-icon">
        </a>
        <ul class="nav-menu">
            <li><a href="art.html" class="active">그림</a></li>
            <li>|</li>
            <li><a href="game.html">웹 게임</a></li>
            <li>|</li>
            <li><a href="#devlog">여정 기록</a></li>
            <li>|</li>
            <li><a href="#about">소개</a></li>
        </ul>
        <div style="width: 40px;"></div>
    </nav>
    
    <!-- 갤러리 -->
    <div class="gallery-container">
        <div class="gallery-grid">
            <!-- 1번 - 왼쪽 위 -->
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_1.mp4" type="video/mp4">
                </video>
            </div>
            
            <!-- 2번 - 오른쪽 위 -->
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_2.mp4" type="video/mp4">
                </video>
            </div>
            
            <!-- 3번 - 왼쪽 -->
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_3.mp4" type="video/mp4">
                </video>
            </div>
            
            <!-- 4번 - 오른쪽 -->
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_4.mp4" type="video/mp4">
                </video>
            </div>
            
            <!-- 5번 - 왼쪽 -->
            <div class="gallery-item">
                <img src="images/0_5.jpg" alt="작품 5">
            </div>
            
            <!-- 6번 - 오른쪽 -->
            <div class="gallery-item">
                <img src="images/0_6.jpg" alt="작품 6">
            </div>
            
            <!-- 7번 - 왼쪽 -->
            <div class="gallery-item">
                <img src="images/0_7.jpg" alt="작품 7">
            </div>
            
            <!-- 8번 - 오른쪽 -->
            <div class="gallery-item">
                <img src="images/0_8.jpg" alt="작품 8">
            </div>
            
            <!-- 더 추가하려면 위 형식 복사 -->
            
        </div>
    </div>
    
    <!-- 라이트박스 (이미지 크게 보기) -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="" id="lightbox-img">
    </div>
    
    <script>
        // 이미지 클릭하면 크게 보기
        const galleryImages = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.lightbox-close');
        
        galleryImages.forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            });
        });
        
        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });
        
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
```

## 📐 변경사항

**이전 (Masonry - 테트리스)**:
```
왼쪽: 1, 3, 5, 7
오른쪽: 2, 4, 6, 8
```

**현재 (Grid - 순서대로)**:
```
1  2
3  4
5  6
7  8
