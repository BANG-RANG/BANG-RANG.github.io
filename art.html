<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그림 - 방랑일지</title>
    <style>
        /* 폰트 정의 */
        @font-face {
            font-family: 'Hakgyoansim';
            src: url('Hakgyoansim Byeolbichhaneul TTF B.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            color: #000000;
        }
        
        /* 상단 메뉴바 */
        .navbar {
            background: #000000;
            width: 100%;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        
        .nav-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            list-style: none;
            font-family: 'Hakgyoansim', 'Batang', serif;
        }
        
        .nav-menu li {
            display: inline;
        }
        
        .nav-menu a {
            color: #808080;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
        }
        
        /* 갤러리 컨테이너 */
        .gallery-container {
            padding: 80px 20px 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 테트리스 스타일 갤러리 */
        .masonry-gallery {
            column-count: 2;
            column-gap: 20px;
        }
        
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .gallery-item video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 반응형 - 모바일 */
        @media (max-width: 768px) {
            .masonry-gallery {
                column-count: 1;
            }
            
            .nav-menu {
                gap: 15px;
                flex-wrap: wrap;
            }
            
            .nav-menu a {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="index.html">홈</a></li>
            <li>|</li>
            <li><a href="art.html" class="active">그림</a></li>
            <li>|</li>
            <li><a href="#games">웹 게임</a></li>
            <li>|</li>
            <li><a href="#devlog">여정 기록</a></li>
            <li>|</li>
            <li><a href="#about">소개</a></li>
        </ul>
    </nav>
    
    <!-- 갤러리 -->
    <div class="gallery-container">
        <div class="masonry-gallery">
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_1.mp4" type="video/mp4">
                </video>
            </div>
            
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_2.mp4" type="video/mp4">
                </video>
            </div>
            
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_3.mp4" type="video/mp4">
                </video>
            </div>
            
            <div class="gallery-item">
                <video autoplay loop muted playsinline>
                    <source src="images/0_4.mp4" type="video/mp4">
                </video>
            </div>
        </div>
    </div>
</body>
</html>
