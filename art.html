<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그림 - 방랑일지</title>
    <style>
        /* 폰트 정의 */
        @font-face {
            font-family: 'Hakgyoansim';
            src: url('Hakgyoansim Byeolbichhaneul TTF B.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            color: #000000;
        }
        
        /* 상단 메뉴바 */
        .navbar {
            background: #000000;
            width: 100%;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        
        .nav-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            list-style: none;
            font-family: 'Hakgyoansim', 'Batang', serif;
        }
        
        .nav-menu li {
            display: inline;
        }
        
        .nav-menu a {
            color: #808080;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
        }
        
        /* 갤러리 컨테이너 */
        .gallery-container {
            padding: 100px 20px 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .gallery-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 50px;
            color: #000000;
        }
        
        /* 테트리스 스타일 갤러리 (Masonry Layout) */
        .masonry-gallery {
            column-count: 3;
            column-gap: 20px;
        }
        
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 반응형 - 태블릿 */
        @media (max-width: 992px) {
            .masonry-gallery {
                column-count: 2;
            }
            
            .gallery-title {
                font-size: 2em;
            }
        }
        
        /* 반응형 - 모바일 */
        @media (max-width: 600px) {
            .masonry-gallery {
                column-count: 1;
            }
            
            .gallery-title {
                font-size: 1.5em;
            }
            
            .nav-menu {
                gap: 15px;
                flex-wrap: wrap;
            }
            
            .nav-menu a {
                font-size: 0.9em;
            }
        }
        
        /* 라이트박스 (이미지 클릭 시 크게 보기) */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="index.html">홈</a></li>
            <li>|</li>
            <li><a href="art.html" class="active">그림</a></li>
            <li>|</li>
            <li><a href="#games">웹 게임</a></li>
            <li>|</li>
            <li><a href="#devlog">여정 기록</a></li>
            <li>|</li>
            <li><a href="#about">소개</a></li>
        </ul>
    </nav>
    
    <!-- 갤러리 -->
    <div class="gallery-container">
        <h1 class="gallery-title">그림 여행 🎨</h1>
        
        <div class="masonry-gallery">
            <!-- 이미지 추가하는 곳 -->
            <div class="gallery-item">
                <img src="images/art1.jpg" alt="작품 1">
            </div>
            
            <div class="gallery-item">
                <img src="images/art2.png" alt="작품 2">
            </div>
            
            <div class="gallery-item">
                <img src="images/art3.jpg" alt="작품 3">
            </div>
            
            <!-- 이미지 더 추가하려면 위 형식 복사 -->
            
        </div>
    </div>
    
    <!-- 라이트박스 (이미지 크게 보기) -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close">&times;</span>
        <img src="" alt="" id="lightbox-img">
    </div>
    
    <script>
        // 이미지 클릭하면 크게 보기
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.querySelector('.lightbox-close');
        
        galleryItems.forEach(item => {
            item.addEventListener('click', () => {
                lightboxImg.src = item.src;
                lightbox.classList.add('active');
            });
        });
        
        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });
        
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });
    </script>
</body>
</html>
