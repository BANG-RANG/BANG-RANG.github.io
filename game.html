<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플랫포머 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: #87CEEB;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
        }
        #instructions {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        .key {
            display: inline-block;
            padding: 5px 10px;
            background: #f0f0f0;
            border: 2px solid #999;
            border-radius: 5px;
            margin: 0 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1 style="color: #333; margin-top: 0;">🎮 플랫포머 게임</h1>
        <div id="score">점수: 0</div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">
            <p><span class="key">←</span> <span class="key">→</span> 이동 | <span class="key">SPACE</span> 점프</p>
            <p>⭐ 별을 모으세요!</p>
        </div>
    </div>

    <script>
        // =====================================
        // 🎨 이미지 교체 가이드
        // =====================================
        // 1. 아래 createPlayerImage, createPlatformImage 등의 함수에서
        //    canvas 드로잉 대신 img.src = "your-image.png" 형태로 변경하세요
        // 2. 이미지 파일을 같은 폴더에 업로드하고 경로를 지정하세요
        // 3. 예시:
        //    function createPlayerImage() {
        //        const img = new Image();
        //        img.src = "player.png";  // 여기에 이미지 경로
        //        return img;
        //    }
        // =====================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        // 게임 상태
        let score = 0;
        let gameRunning = true;

        // 키 입력
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // 플레이어 이미지 생성 (여기를 수정하여 본인 이미지 사용)
        function createPlayerImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 40;
            canvas.height = 40;
            const ctx = canvas.getContext('2d');
            
            // 간단한 캐릭터 그리기
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(5, 5, 30, 30);
            ctx.fillStyle = '#FFF';
            ctx.fillRect(12, 12, 8, 8);
            ctx.fillRect(25, 12, 8, 8);
            ctx.fillRect(12, 25, 16, 5);
            
            return canvas;
        }

        // 플랫폼 이미지 생성
        function createPlatformImage(width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#A0522D';
            for (let i = 0; i < width; i += 20) {
                ctx.fillRect(i, 0, 18, height);
            }
            
            return canvas;
        }

        // 별 이미지 생성
        function createStarImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 30;
            canvas.height = 30;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(
                    15 + 12 * Math.cos((i * 4 * Math.PI) / 5 - Math.PI / 2),
                    15 + 12 * Math.sin((i * 4 * Math.PI) / 5 - Math.PI / 2)
                );
            }
            ctx.closePath();
            ctx.fill();
            
            return canvas;
        }

        // 플레이어
        const player = {
            x: 100,
            y: 100,
            width: 40,
            height: 40,
            velX: 0,
            velY: 0,
            speed: 5,
            jumpPower: 12,
            grounded: false,
            image: createPlayerImage()
        };

        // 플랫폼들
        const platforms = [
            { x: 0, y: 550, width: 800, height: 50, image: null },
            { x: 200, y: 450, width: 150, height: 20, image: null },
            { x: 450, y: 400, width: 150, height: 20, image: null },
            { x: 100, y: 350, width: 120, height: 20, image: null },
            { x: 600, y: 300, width: 150, height: 20, image: null },
            { x: 300, y: 250, width: 200, height: 20, image: null }
        ];

        // 플랫폼 이미지 생성
        platforms.forEach(p => {
            p.image = createPlatformImage(p.width, p.height);
        });

        // 수집 아이템 (별)
        const stars = [
            { x: 250, y: 410, width: 30, height: 30, collected: false },
            { x: 500, y: 360, width: 30, height: 30, collected: false },
            { x: 150, y: 310, width: 30, height: 30, collected: false },
            { x: 650, y: 260, width: 30, height: 30, collected: false },
            { x: 400, y: 210, width: 30, height: 30, collected: false }
        ];

        const starImage = createStarImage();

        // 중력
        const gravity = 0.5;

        // 충돌 감지
        function collisionCheck(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 게임 업데이트
        function update() {
            if (!gameRunning) return;

            // 좌우 이동
            if (keys['ArrowLeft']) {
                player.velX = -player.speed;
            } else if (keys['ArrowRight']) {
                player.velX = player.speed;
            } else {
                player.velX = 0;
            }

            // 점프
            if (keys['Space'] && player.grounded) {
                player.velY = -player.jumpPower;
                player.grounded = false;
            }

            // 중력 적용
            player.velY += gravity;

            // 위치 업데이트
            player.x += player.velX;
            player.y += player.velY;

            // 화면 경계
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }

            // 플랫폼 충돌
            player.grounded = false;
            platforms.forEach(platform => {
                if (collisionCheck(player, platform)) {
                    // 위에서 떨어질 때
                    if (player.velY > 0 && player.y + player.height - player.velY < platform.y + 10) {
                        player.y = platform.y - player.height;
                        player.velY = 0;
                        player.grounded = true;
                    }
                    // 아래에서 부딪힐 때
                    else if (player.velY < 0 && player.y - player.velY > platform.y + platform.height) {
                        player.y = platform.y + platform.height;
                        player.velY = 0;
                    }
                    // 옆에서 부딪힐 때
                    else if (player.velX > 0) {
                        player.x = platform.x - player.width;
                    } else if (player.velX < 0) {
                        player.x = platform.x + platform.width;
                    }
                }
            });

            // 바닥 아래로 떨어지면 리셋
            if (player.y > canvas.height) {
                player.x = 100;
                player.y = 100;
                player.velY = 0;
            }

            // 별 수집
            stars.forEach(star => {
                if (!star.collected && collisionCheck(player, star)) {
                    star.collected = true;
                    score += 10;
                    scoreDisplay.textContent = '점수: ' + score;
                }
            });
        }

        // 그리기
        function draw() {
            // 배경
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 구름 그리기
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(150, 100, 30, 0, Math.PI * 2);
            ctx.arc(180, 100, 35, 0, Math.PI * 2);
            ctx.arc(210, 100, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(500, 150, 25, 0, Math.PI * 2);
            ctx.arc(525, 150, 30, 0, Math.PI * 2);
            ctx.arc(550, 150, 25, 0, Math.PI * 2);
            ctx.fill();

            // 플랫폼 그리기
            platforms.forEach(platform => {
                ctx.drawImage(platform.image, platform.x, platform.y);
            });

            // 별 그리기
            stars.forEach(star => {
                if (!star.collected) {
                    ctx.drawImage(starImage, star.x, star.y);
                }
            });

            // 플레이어 그리기
            ctx.drawImage(player.image, player.x, player.y);
        }

        // 게임 루프
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 게임 시작
        gameLoop();
    </script>
</body>
</html>
