<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 게임 - 방랑일지</title>
    <style>
        /* 폰트 정의 */
        @font-face {
            font-family: 'Hakgyoansim';
            src: url('Hakgyoansim Byeolbichhaneul TTF B.ttf') format('truetype');
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Batang', 'Batangche', '바탕', serif;
            background: #d3d3d3;
            color: #000000;
            overflow-x: hidden;
        }
        
        /* 상단 메뉴바 */
        .navbar {
            background: #000000;
            width: 100%;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .home-icon {
            height: 40px;
            width: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .home-icon:hover {
            transform: scale(1.1);
        }
        
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 50px;
            list-style: none;
            font-family: 'Hakgyoansim', 'Batang', serif;
            margin: 0 auto;
        }
        
        .nav-menu li {
            display: inline;
        }
        
        .nav-menu a {
            color: #808080;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        
        .nav-menu a:hover,
        .nav-menu a.active {
            color: #ffffff;
        }
        
        /* 게임 컨테이너 */
        .game-container {
            margin-top: 80px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .game-title {
            font-size: 2em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        #gameCanvas {
            border: 3px solid #000;
            background: #1a1a2e;
            cursor: crosshair;
            max-width: 100%;
        }
        
        .game-info {
            margin-top: 20px;
            text-align: center;
            font-size: 1.2em;
        }
        
        .controls {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            text-align: center;
        }
        
        .btn {
            padding: 10px 20px;
            font-size: 1.1em;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-family: 'Hakgyoansim', 'Batang', serif;
        }
        
        .btn:hover {
            background: #333;
        }
        
        /* 반응형 */
        @media (max-width: 768px) {
            .home-icon {
                height: 35px;
            }
            
            .nav-menu {
                gap: 30px;
            }
            
            .nav-menu a {
                font-size: 1em;
            }
            
            .game-title {
                font-size: 1.5em;
            }
        }
        
        @media (max-width: 480px) {
            .navbar {
                padding: 10px 15px;
                flex-direction: column;
                gap: 10px;
            }
            
            .home-icon {
                height: 30px;
                align-self: flex-start;
            }
            
            .nav-menu {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .nav-menu a {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 메뉴 -->
    <nav class="navbar">
        <a href="index.html">
            <img src="icon/homeicon.png" alt="홈" class="home-icon">
        </a>
        <ul class="nav-menu">
            <li><a href="art.html">그림</a></li>
            <li>|</li>
            <li><a href="game.html" class="active">웹 게임</a></li>
            <li>|</li>
            <li><a href="#devlog">여정 기록</a></li>
            <li>|</li>
            <li><a href="#about">소개</a></li>
        </ul>
        <div style="width: 40px;"></div>
    </nav>
    
    <!-- 게임 -->
    <div class="game-container">
        <h1 class="game-title">🚀 우주 슈팅 게임</h1>
        
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        
        <div class="game-info">
            <div>점수: <span id="score">0</span></div>
            <div>생명: <span id="lives">3</span></div>
        </div>
        
        <div class="controls">
            <p>⌨️ 마우스로 이동 | 클릭 or 스페이스바로 발사</p>
            <button class="btn" onclick="restartGame()">🔄 다시 시작</button>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 게임 변수
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let animationId;
        
        // 플레이어
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 40,
            speed: 5
        };
        
        // 총알
        let bullets = [];
        const bulletSpeed = 7;
        
        // 적
        let enemies = [];
        const enemySpeed = 2;
        let enemySpawnTimer = 0;
        
        // 마우스 위치
        let mouseX = player.x;
        
        // 이벤트 리스너
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });
        
        canvas.addEventListener('click', shoot);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });
        
        // 터치 지원
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shoot();
        });
        
        // 발사
        function shoot() {
            if (gameOver) return;
            bullets.push({
                x: player.x,
                y: player.y,
                width: 4,
                height: 15
            });
        }
        
        // 적 생성
        function spawnEnemy() {
            const size = 30 + Math.random() * 20;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: enemySpeed + Math.random() * 2
            });
        }
        
        // 충돌 감지
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // 업데이트
        function update() {
            if (gameOver) return;
            
            // 플레이어 이동
            player.x += (mouseX - player.x) * 0.1;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            
            // 총알 업데이트
            bullets = bullets.filter(bullet => {
                bullet.y -= bulletSpeed;
                return bullet.y > 0;
            });
            
            // 적 업데이트
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                
                // 플레이어와 충돌
                if (checkCollision(player, enemy)) {
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    if (lives <= 0) {
                        gameOver = true;
                        alert('게임 오버! 점수: ' + score);
                    }
                    return false;
                }
                
                return enemy.y < canvas.height;
            });
            
            // 총알-적 충돌
            bullets.forEach((bullet, bIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        bullets.splice(bIndex, 1);
                        enemies.splice(eIndex, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                    }
                });
            });
            
            // 적 생성
            enemySpawnTimer++;
            if (enemySpawnTimer > 60) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }
        }
        
        // 그리기
        function draw() {
            // 배경
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 별 배경
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137.5) % canvas.width;
                const y = (i * 217.3 + Date.now() * 0.05) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }
            
            // 플레이어
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 10, player.y + 10, 20, 20);
            
            // 총알
            ctx.fillStyle = '#ffff00';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
            
            // 적
            ctx.fillStyle = '#ff0000';
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });
        }
        
        // 게임 루프
        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // 게임 재시작
        function restartGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            bullets = [];
            enemies = [];
            enemySpawnTimer = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            gameLoop();
        }
        
        // 게임 시작
        gameLoop();
    </script>
</body>
</html>
